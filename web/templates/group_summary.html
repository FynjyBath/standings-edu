{{define "content"}}
<section class="page-head">
  <h1>{{.GroupTitle}}</h1>
  <p class="summary-links">
    <a class="summary-link-btn" href="/standings/{{.GroupSlug}}{{if .Token}}?token={{.Token}}{{end}}">Списком</a>
  </p>
  {{if .UnfrozenView}}
  <p class="empty-hint">🔓 Просмотр без заморозки (по токену).</p>
  {{end}}
  <p class="summary-links" id="summary-tabs"></p>
</section>

<section class="contest-block">
  <h2>Сводная таблица</h2>
  <div class="table-wrap" id="summary-root"></div>
  <p class="empty-hint" id="summary-empty" style="display:none;">Нет контестов для выбранной таблицы.</p>
</section>

<script id="summary-data" type="application/json">{{.StandingsJSON}}</script>
<script>
  (function () {
    var root = document.getElementById("summary-root");
    var empty = document.getElementById("summary-empty");
    var tabsRoot = document.getElementById("summary-tabs");
    if (!root || !empty || !tabsRoot) {
      return;
    }

    var raw = document.getElementById("summary-data");
    if (!raw) {
      empty.style.display = "";
      return;
    }

    var standings;
    try {
      standings = JSON.parse(raw.textContent || "{}");
    } catch (e) {
      empty.textContent = "Ошибка чтения данных summary.";
      empty.style.display = "";
      return;
    }

    var ALL_TAB = "Все"; // "Все"
    var allContests = Array.isArray(standings.contests) ? standings.contests : [];

    function tableNamesOf(contest) {
      return Array.isArray(contest.table_name) ? contest.table_name : [];
    }

    // Порядок вкладок = порядок первого появления имени в контестах группы.
    var tabOrder = [];
    var seenTab = Object.create(null);
    allContests.forEach(function (contest) {
      tableNamesOf(contest).forEach(function (name) {
        if (typeof name === "string" && name && !seenTab[name]) {
          seenTab[name] = true;
          tabOrder.push(name);
        }
      });
    });
    var tabs = [ALL_TAB].concat(tabOrder);

    function contestsForTab(tab) {
      if (tab === ALL_TAB) {
        return allContests;
      }
      return allContests.filter(function (contest) {
        return tableNamesOf(contest).indexOf(tab) >= 0;
      });
    }

    function clampScore(v) {
      if (!Number.isFinite(v)) return 0;
      if (v < 0) return 0;
      if (v > 100) return 100;
      return v;
    }

    function contestSubcontests(contest) {
      if (Array.isArray(contest.subcontests) && contest.subcontests.length > 0) {
        return contest.subcontests;
      }
      return [{
        title: "Результаты",
        tasks: Array.isArray(contest.tasks) ? contest.tasks : []
      }];
    }

    // Строит сводную таблицу по набору контестов. Возвращает <table> или null.
    function buildTable(contests) {
      var studentsMap = new Map();
      contests.forEach(function (contest) {
        (contest.rows || []).forEach(function (row) {
          if (!row || !row.student_id) return;
          if (!studentsMap.has(row.student_id)) {
            studentsMap.set(row.student_id, {
              student_id: row.student_id,
              public_name: row.public_name || row.student_id
            });
          }
        });
      });
      var contestRowMaps = contests.map(function (contest) {
        var rowMap = new Map();
        (contest.rows || []).forEach(function (row) {
          if (row && row.student_id) rowMap.set(row.student_id, row);
        });
        return rowMap;
      });

      // Итоги ученика по контестам вкладки: Σ баллов — из готовых сумм контестов
      // (учитывают дорешку и штраф за нули), Σ плюсов — по ячейкам.
      function totalsOf(studentId) {
        var totalScore = 0;
        var totalPlus = 0;
        contests.forEach(function (contest, contestIdx) {
          var row = contestRowMaps[contestIdx].get(studentId);
          if (!row) return;
          var isIoi = String(contest.score_system || "edu").toLowerCase() === "ioi";
          if (isIoi && typeof row.total_score === "number" && Number.isFinite(row.total_score)) {
            totalScore += row.total_score;
          }
          var tasks = Array.isArray(contest.tasks) ? contest.tasks : [];
          for (var i = 0; i < tasks.length; i++) {
            if (Array.isArray(row.statuses) && row.statuses[i] === "solved") totalPlus++;
          }
        });
        return { score: totalScore, plus: totalPlus };
      }

      // Сортировка по убыванию результатов; при равенстве — по имени.
      var students = Array.from(studentsMap.values());
      var totalsById = new Map();
      students.forEach(function (s) { totalsById.set(s.student_id, totalsOf(s.student_id)); });
      students.sort(function (a, b) {
        var ta = totalsById.get(a.student_id);
        var tb = totalsById.get(b.student_id);
        if (ta.score !== tb.score) return tb.score - ta.score;
        if (ta.plus !== tb.plus) return tb.plus - ta.plus;
        return (a.public_name || "").localeCompare(b.public_name || "", "ru");
      });

      var table = document.createElement("table");
      table.className = "standings-table summary-table";

      var thead = document.createElement("thead");
      var trTop = document.createElement("tr");
      var trMid = document.createElement("tr");
      var trBottom = document.createElement("tr");

      var thStudent = document.createElement("th");
      thStudent.className = "student-col";
      thStudent.rowSpan = 3;
      thStudent.textContent = "Ученик";
      trTop.appendChild(thStudent);

      var thScore = document.createElement("th");
      thScore.className = "count-col";
      thScore.rowSpan = 3;
      thScore.textContent = "Σ баллов";
      trTop.appendChild(thScore);

      var thPlus = document.createElement("th");
      thPlus.className = "count-col";
      thPlus.rowSpan = 3;
      thPlus.textContent = "Σ +";
      trTop.appendChild(thPlus);

      var totalTaskCount = 0;
      contests.forEach(function (contest) {
        var tasks = Array.isArray(contest.tasks) ? contest.tasks : [];
        if (tasks.length === 0) return;
        var contestTitle = contest.title || contest.id || "Контест";
        if (contest.frozen_at) contestTitle += " ❄ (заморожено)";

        // Контест «только сумма»: одна колонка на все три ряда шапки.
        // Заголовок — краткое название, если оно задано; полное — в тултипе.
        if (contest.summary_total_only) {
          totalTaskCount += 1;
          var single = document.createElement("th");
          single.className = "subcontest-head";
          single.rowSpan = 3;
          if (contest.short_name) {
            var shortTitle = contest.short_name;
            if (contest.frozen_at) shortTitle += " ❄";
            single.textContent = shortTitle;
            single.title = contestTitle;
          } else {
            single.textContent = contestTitle;
          }
          trTop.appendChild(single);
          return;
        }

        totalTaskCount += tasks.length;

        var top = document.createElement("th");
        top.className = "subcontest-head";
        top.colSpan = tasks.length;
        top.textContent = contestTitle;
        trTop.appendChild(top);

        contestSubcontests(contest).forEach(function (subcontest) {
          var subTasks = Array.isArray(subcontest.tasks) ? subcontest.tasks : [];
          if (subTasks.length === 0) return;
          var mid = document.createElement("th");
          mid.className = "subcontest-head";
          mid.colSpan = subTasks.length;
          mid.textContent = subcontest.title || "Подконтест";
          trMid.appendChild(mid);

          subTasks.forEach(function (task) {
            var th = document.createElement("th");
            th.className = "task-col";
            if (task.url) {
              var a = document.createElement("a");
              a.href = task.url;
              a.target = "_blank";
              a.rel = "noopener noreferrer";
              a.textContent = task.label || "?";
              th.appendChild(a);
            } else {
              // Ссылки скрыты до начала контеста — показываем только метку.
              th.textContent = task.label || "?";
            }
            trBottom.appendChild(th);
          });
        });
      });

      if (totalTaskCount === 0) {
        return null;
      }

      thead.appendChild(trTop);
      thead.appendChild(trMid);
      thead.appendChild(trBottom);
      table.appendChild(thead);

      var tbody = document.createElement("tbody");
      students.forEach(function (student) {
        var tr = document.createElement("tr");

        var tdName = document.createElement("td");
        tdName.className = "student-name";
        tdName.textContent = student.public_name;
        tr.appendChild(tdName);

        var totals = totalsById.get(student.student_id) || { score: 0, plus: 0 };
        var totalScore = totals.score;
        var totalPlus = totals.plus;
        var cells = [];

        contests.forEach(function (contest, contestIdx) {
          var tasks = Array.isArray(contest.tasks) ? contest.tasks : [];
          if (tasks.length === 0) return;
          var row = contestRowMaps[contestIdx].get(student.student_id) || null;
          var isIoi = String(contest.score_system || "edu").toLowerCase() === "ioi";

          // Контест «только сумма»: одна ячейка — баллы (ioi) или плюсы (edu).
          if (contest.summary_total_only) {
            var totalTd = document.createElement("td");
            totalTd.className = "solved-count";
            if (!row) {
              totalTd.textContent = "";
            } else if (isIoi) {
              totalTd.textContent = (typeof row.total_score === "number") ? String(row.total_score) : "";
            } else {
              totalTd.textContent = (typeof row.solved_count === "number") ? String(row.solved_count) : "";
            }
            cells.push(totalTd);
            return;
          }

          for (var i = 0; i < tasks.length; i++) {
            var status = "none";
            if (row && Array.isArray(row.statuses) && i < row.statuses.length && row.statuses[i]) {
              status = row.statuses[i];
            }

            var score = null;
            if (row && Array.isArray(row.scores) && i < row.scores.length) {
              var s = row.scores[i];
              if (typeof s === "number" && Number.isFinite(s)) score = s;
            }
            var practiceScore = null;
            if (row && Array.isArray(row.practice_scores) && i < row.practice_scores.length) {
              var p = row.practice_scores[i];
              if (typeof p === "number" && Number.isFinite(p)) practiceScore = p;
            }

            var practice = !!(row && Array.isArray(row.upsolved) && row.upsolved[i]);
            var td = document.createElement("td");
            if (isIoi) {
              td.className = practice ? "score-cell practice" : "score-cell";
              // «50 (70)»: основной балл и дорешка; фон — по лучшему из них.
              var effective = (practiceScore !== null && (score === null || practiceScore > score)) ? practiceScore : score;
              if (score !== null && practiceScore !== null) {
                td.textContent = String(score) + " (" + String(practiceScore) + ")";
              } else if (practiceScore !== null) {
                td.textContent = "(" + String(practiceScore) + ")";
              } else if (score !== null) {
                td.textContent = wrapPractice(String(score), practice);
              } else {
                td.textContent = "";
              }
              td.style.setProperty("--score-alpha", effective !== null ? String(clampScore(effective) / 100) : "0");
            } else {
              td.className = "status-cell " + status + (practice ? " practice" : "");
              if (status === "solved") {
                td.textContent = wrapPractice("+", practice);
              } else if (status === "attempted") {
                td.textContent = wrapPractice("×", practice);
              } else {
                td.textContent = "";
              }
            }
            cells.push(td);
          }
        });

        var tdScore = document.createElement("td");
        tdScore.className = "solved-count";
        tdScore.textContent = String(totalScore);
        tr.appendChild(tdScore);

        var tdPlus = document.createElement("td");
        tdPlus.className = "solved-count";
        tdPlus.textContent = String(totalPlus);
        tr.appendChild(tdPlus);

        cells.forEach(function (cell) { tr.appendChild(cell); });
        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      return table;
    }

    function wrapPractice(text, practice) {
      return (practice && text) ? "(" + text + ")" : text;
    }

    function render(tab) {
      root.textContent = "";
      var table = buildTable(contestsForTab(tab));
      if (!table) {
        empty.textContent = "Нет задач в выбранной таблице.";
        empty.style.display = "";
        return;
      }
      empty.style.display = "none";
      root.appendChild(table);
    }

    var activeTab = tabs[0];
    var tabButtons = [];
    function selectTab(tab) {
      activeTab = tab;
      tabButtons.forEach(function (btn) {
        btn.classList.toggle("is-active", btn.dataset.tab === tab);
      });
      render(tab);
    }

    // Одна вкладка «Все» и никаких table_name — прячем строку вкладок.
    if (tabs.length > 1) {
      tabs.forEach(function (tab) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "summary-link-btn";
        btn.dataset.tab = tab;
        btn.textContent = tab;
        btn.addEventListener("click", function () { selectTab(tab); });
        tabsRoot.appendChild(btn);
        tabButtons.push(btn);
      });
    } else {
      tabsRoot.style.display = "none";
    }

    selectTab(activeTab);
  })();
</script>
{{end}}

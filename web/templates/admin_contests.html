{{define "content"}}
<section class="page-head">
  <h1>Контесты</h1>
  <p class="summary-links"><a class="summary-link-btn" href="/standings/admin">← В админку</a></p>
</section>

<section class="admin-block">
  {{template "contestForm" .}}
  <div class="admin-editor-tools" style="margin-top:0.8rem;">
    <button type="button" id="c-save" class="admin-btn">Сохранить</button>
    <button type="button" id="c-reset" class="admin-btn admin-btn--secondary">Очистить форму</button>
    <span id="c-status" class="admin-editor-status"></span>
  </div>
</section>

<section class="admin-block">
  <h2>Список ({{len .Contests}})</h2>
  {{if .Contests}}
  <div class="filter-bar">
    <input type="search" class="filter-input" placeholder="Фильтр по названию, id, типу…" autocomplete="off" spellcheck="false"
           data-filter-rows="#contests-tbody tr" data-filter-count="#contests-count" data-filter-empty="#contests-empty" />
    <span class="filter-count" id="contests-count"></span>
  </div>
  <div class="table-wrap">
    <table class="standings-table data-table">
      <thead><tr><th>Название</th><th>id</th><th>Тип</th><th>score</th><th></th></tr></thead>
      <tbody id="contests-tbody">
        {{range .Contests}}
        <tr data-filter-text="{{.Title}} {{.ID}} {{.Type}} {{.ScoreSystem}}">
          <td>{{.Title}}</td><td><code>{{.ID}}</code></td><td>{{.Type}}</td><td>{{.ScoreSystem}}</td>
          <td style="white-space:nowrap;">
            <button type="button" class="admin-btn admin-btn--secondary c-edit" data-id="{{.ID}}">Изм.</button>
            <button type="button" class="admin-btn admin-btn--secondary c-delete" data-id="{{.ID}}">Удал.</button>
          </td>
        </tr>
        {{end}}
      </tbody>
    </table>
  </div>
  <p class="empty-hint" id="contests-empty" hidden>Ничего не найдено.</p>
  {{else}}<div class="empty-state"><span class="empty-state-icon" aria-hidden="true">📭</span><p>Контестов пока нет.</p></div>{{end}}
</section>

<script id="contests-data" type="application/json">{{.ContestsJSON}}</script>
<script>
  (function () {
    var byId = {};
    try { JSON.parse(document.getElementById("contests-data").textContent || "[]").forEach(function (c) { byId[c.id] = c; }); } catch (e) {}
    ContestForm.show();
    // Окно и заморозка, заданные здесь, действуют для всех групп-ссылок;
    // группа может переопределить их на своей странице.

    var status = document.getElementById("c-status");
    function setStatus(m, err) { status.textContent = m; status.className = err ? "admin-editor-status admin-editor-status--error" : "admin-editor-status admin-editor-status--ok"; }

    document.querySelectorAll(".c-edit").forEach(function (b) { b.addEventListener("click", function () { var c = byId[b.dataset.id]; if (c) { ContestForm.fill(c); window.scrollTo({ top: 0, behavior: "smooth" }); } }); });
    document.getElementById("c-reset").addEventListener("click", function () { ContestForm.reset(); setStatus("", false); });

    document.getElementById("c-save").addEventListener("click", function () {
      setStatus("Сохранение…", false);
      fetch("/api/admin/contests/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(ContestForm.collect()) })
        .then(function (res) { return res.json().then(function (p) { if (!res.ok || !p.ok) throw new Error(p.error || res.status); }); })
        .then(function () { location.reload(); })
        .catch(function (err) { setStatus(err.message, true); });
    });

    document.querySelectorAll(".c-delete").forEach(function (b) {
      b.addEventListener("click", function () {
        if (!confirm("Удалить контест «" + b.dataset.id + "»?")) return;
        fetch("/api/admin/contests/delete", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: b.dataset.id }) })
          .then(function (res) { return res.json().then(function (p) { if (!res.ok || !p.ok) throw new Error(p.error || res.status); }); })
          .then(function () { location.reload(); })
          .catch(function (err) { alert(err.message); });
      });
    });
  })();
</script>
{{end}}

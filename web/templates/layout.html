{{define "layout"}}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>{{.PageTitle}}</title>
    <script>
      (function () {
        var storageKey = "nemalo-theme";
        // Сохранённый выбор пользователя важнее всего; если его нет — следуем
        // системной теме ОС (prefers-color-scheme), иначе светлая по умолчанию.
        var theme = "light";
        try {
          var saved = localStorage.getItem(storageKey);
          if (saved === "light" || saved === "dark") {
            theme = saved;
          } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
            theme = "dark";
          }
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <script>
      // Всё абсолютное время на сайте показываем в поясе браузера смотрящего.
      // Сервер отдаёт моменты в ISO 8601 (с зоной), клиент форматирует локально —
      // так время всегда «как у зрителя на часах», без путаницы поясов.
      window.LT = (function () {
        var MON = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
        function pad2(n) { return String(n).padStart(2, "0"); }
        function hhmm(ms) { var d = new Date(ms); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
        function hhmmss(ms) { var d = new Date(ms); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds()); }
        function dayMon(ms) { var d = new Date(ms); return d.getDate() + " " + MON[d.getMonth()]; }
        function sameDay(a, b) { a = new Date(a); b = new Date(b); return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
        // Полная дата-время: «ДД.ММ.ГГГГ ЧЧ:ММ[:СС]».
        function full(ms, withSec) {
          var d = new Date(ms);
          var s = pad2(d.getDate()) + "." + pad2(d.getMonth() + 1) + "." + d.getFullYear() + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
          return withSec ? s + ":" + pad2(d.getSeconds()) : s;
        }
        // Заполняет локальным временем все элементы [data-localtime] (ISO в
        // атрибуте, data-sec="1" — с секундами). Идемпотентно (можно звать после
        // ленивой подгрузки). Если разбор не удался — оставляет серверный текст.
        function paint(scope) {
          (scope || document).querySelectorAll("[data-localtime]").forEach(function (el) {
            var ms = Date.parse(el.getAttribute("data-localtime") || "");
            if (!isNaN(ms)) el.textContent = full(ms, el.getAttribute("data-sec") === "1");
          });
        }
        return { hhmm: hhmm, hhmmss: hhmmss, dayMon: dayMon, sameDay: sameDay, full: full, paint: paint };
      })();
      document.addEventListener("DOMContentLoaded", function () { window.LT.paint(document); });
    </script>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/app.js" defer></script>

    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/static/favicon-48x48.png" />
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/standings">standings</a>
        {{if .Footer.LastUpdatedISO}}<span class="header-updated" data-updated="{{.Footer.LastUpdatedISO}}">Последнее обновление: <span data-localtime="{{.Footer.LastUpdatedISO}}" data-sec="1">{{.Footer.LastUpdatedMSK}}</span></span>{{end}}
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Переключить тему" aria-pressed="false">
          <span class="theme-icon theme-icon--sun" aria-hidden="true">☀</span>
          <span class="theme-icon theme-icon--moon" aria-hidden="true">☾</span>
        </button>
      </div>
    </header>
    <main class="container">
      {{template "content" .}}
    </main>
    <footer class="site-footer" data-server-now="{{.Footer.ServerTimeISO}}" data-generate-interval="{{.Footer.IntervalSeconds}}">
      <div class="container footer-inner">
        <div class="footer-line"><a href="https://t.me/fynjybath" target="_blank" rel="noopener noreferrer">Anton Nyikin</a> · <a href="https://github.com/FynjyBath/standings-edu" target="_blank" rel="noopener noreferrer">standings-edu на GitHub</a></div>
        <div class="footer-line" data-updated="{{.Footer.LastUpdatedISO}}">Последнее обновление: <span data-localtime="{{.Footer.LastUpdatedISO}}" data-sec="1">{{.Footer.LastUpdatedMSK}}</span></div>
        <div class="footer-line">Сейчас: <span class="server-clock">{{.Footer.ServerTime}}</span></div>
      </div>
    </footer>
    <script>
      // «Живой» футер и метки «последнее обновление»: серверные часы идут, рядом
      // с каждой меткой показываем «N назад» и (если задан период автогенерации)
      // обратный отсчёт до следующего обновления. Часы клиента синхронизируем по
      // серверному «сейчас», чтобы не зависеть от неверных часов у зрителя.
      (function () {
        var cfg = document.querySelector("[data-server-now]");
        if (!cfg) return;
        var serverNowMs = Date.parse(cfg.getAttribute("data-server-now") || "");
        var intervalSec = parseInt(cfg.getAttribute("data-generate-interval") || "0", 10) || 0;
        var skew = isNaN(serverNowMs) ? 0 : (serverNowMs - Date.now());

        function pad2(n) { return String(n).padStart(2, "0"); }
        function nowMs() { return Date.now() + skew; }

        function ago(sec) {
          sec = Math.max(0, Math.floor(sec));
          if (sec < 10) return "только что";
          if (sec < 60) return sec + " сек назад";
          var m = Math.floor(sec / 60);
          if (m < 60) return m + " мин назад";
          var h = Math.floor(m / 60);
          if (h < 24) return h + " ч " + (m % 60) + " мин назад";
          return Math.floor(h / 24) + " дн назад";
        }
        function countdown(sec) {
          sec = Math.floor(sec);
          if (sec <= 0) return "следующее обновление ожидается…";
          var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
          return "следующее через " + (h > 0 ? h + ":" + pad2(m) + ":" + pad2(s) : m + ":" + pad2(s));
        }

        var clocks = [].slice.call(document.querySelectorAll(".server-clock"));
        var marks = [].slice.call(document.querySelectorAll("[data-updated]")).map(function (el) {
          var span = document.createElement("span");
          span.className = "update-extra";
          el.appendChild(span);
          // data-no-next — таблица не обновляется (контест с update=false): показываем
          // только «сколько назад», без обратного отсчёта до следующего обновления.
          return { el: el, extra: span, ms: Date.parse(el.getAttribute("data-updated") || ""), noNext: el.hasAttribute("data-no-next") };
        });

        function tick() {
          var n = new Date(nowMs());
          var clock = window.LT.hhmmss(n.getTime());
          clocks.forEach(function (c) { c.textContent = clock; });
          marks.forEach(function (m) {
            if (isNaN(m.ms)) { m.extra.textContent = ""; return; }
            var text = " · " + ago((n.getTime() - m.ms) / 1000);
            if (m.noNext) {
              text += " · не обновляется";
            } else if (intervalSec > 0) {
              text += " · " + countdown((m.ms + intervalSec * 1000 - n.getTime()) / 1000);
            }
            m.extra.textContent = text;
          });
        }
        tick();
        setInterval(tick, 1000);
      })();
    </script>
    <script>
      (function () {
        var storageKey = "nemalo-theme";
        var root = document.documentElement;
        var button = document.getElementById("theme-toggle");
        if (!button) {
          return;
        }

        function updateButton() {
          var isDark = root.getAttribute("data-theme") === "dark";
          button.setAttribute("aria-pressed", isDark ? "true" : "false");
          button.setAttribute("title", isDark ? "Тёмная тема" : "Светлая тема");
        }

        button.addEventListener("click", function () {
          var nextTheme = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
          root.setAttribute("data-theme", nextTheme);
          try {
            localStorage.setItem(storageKey, nextTheme);
          } catch (e) {}
          updateButton();
        });

        updateButton();
      })();
    </script>
  </body>
</html>
{{end}}

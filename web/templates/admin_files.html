{{define "content"}}
<section class="page-head">
  <h1>JSON-редактор</h1>
  <p class="summary-links">
    <a class="summary-link-btn" href="/standings/admin">← В админку</a>
    <a class="summary-link-btn" href="/standings/admin/intake">Анкеты учеников</a>
  </p>
  <p class="empty-hint">Прямая правка файлов данных. Проверяйте JSON перед сохранением: файл пишется как есть, битый JSON сломает генерацию. Изменения попадают в таблицы после ближайшей генерации.</p>
</section>

<section class="admin-block">
  <div class="admin-editor-tools">
    <label class="admin-select-wrap">
      <span>Файл</span>
      <select id="admin-file-select">
        {{range .Editable}}
        <option value="{{.}}">{{.}}</option>
        {{end}}
      </select>
    </label>
    <button type="button" id="admin-file-validate" class="admin-btn admin-btn--secondary">Проверить JSON</button>
    <button type="button" id="admin-file-save" class="admin-btn">Сохранить</button>
    <button type="button" id="admin-intake-dryrun" class="admin-btn admin-btn--secondary" style="display:none" aria-hidden="true">Пробный запуск (что куда)</button>
    <button type="button" id="admin-intake-merge-confirm" class="admin-btn" style="display:none" aria-hidden="true">Сохранить и сделать merge intake</button>
  </div>
  <div id="admin-editor" class="admin-editor" aria-label="JSON editor"></div>
  <p id="admin-editor-status" class="admin-editor-status">Выберите файл для редактирования.</p>
  <div id="admin-intake-preview" style="display:none;margin-top:0.8rem;"></div>
</section>


<script src="/static/vendor/ace/ace.js"></script>
<script src="/static/vendor/ace/mode-json.js"></script>
<script src="/static/vendor/ace/theme-github.js"></script>
<script src="/static/vendor/ace/theme-tomorrow_night.js"></script>
<script>
  (function () {
    var select = document.getElementById("admin-file-select");
    var validateButton = document.getElementById("admin-file-validate");
    var saveButton = document.getElementById("admin-file-save");
    var intakePrepareButton = document.getElementById("admin-intake-prepare");
    var intakeMergeConfirmButton = document.getElementById("admin-intake-merge-confirm");
    var statusNode = document.getElementById("admin-editor-status");
    var editorRoot = document.getElementById("admin-editor");
    var intakeStagingPath = "data/student_intake_admin.json";
    var intakeStagingSelectValue = "__intake_staging_merge_mode__";
    var activePath = "";

    if (!select || !validateButton || !saveButton || !intakeMergeConfirmButton || !statusNode || !editorRoot) {
      return;
    }

    if (!window.ace) {
      statusNode.textContent = "ACE editor не загрузился";
      statusNode.className = "admin-editor-status admin-editor-status--error";
      return;
    }

    var editor = ace.edit(editorRoot);
    editor.session.setMode("ace/mode/json");
    editor.session.setUseWorker(false);
    editor.setOptions({
      fontSize: "14px",
      tabSize: 2,
      useSoftTabs: true,
      showPrintMargin: false,
      wrap: false
    });

    function updateTheme() {
      var isDark = document.documentElement.getAttribute("data-theme") === "dark";
      editor.setTheme(isDark ? "ace/theme/tomorrow_night" : "ace/theme/github");
    }

    updateTheme();
    var observer = new MutationObserver(updateTheme);
    observer.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

    function setStatus(message, isError) {
      statusNode.textContent = message;
      statusNode.className = isError
        ? "admin-editor-status admin-editor-status--error"
        : "admin-editor-status admin-editor-status--ok";
    }

    async function fetchJSON(url, options) {
      var response = await fetch(url, options);
      var payload = null;
      try {
        payload = await response.json();
      } catch (e) {
        throw new Error("invalid JSON response");
      }
      if (!response.ok || !payload.ok) {
        throw new Error((payload && payload.error) || ("HTTP " + response.status));
      }
      return payload;
    }

    function buildFileOptions(files, selected) {
      select.innerHTML = "";
      files.forEach(function (path) {
        var option = document.createElement("option");
        option.value = path;
        option.textContent = path;
        if (path === selected) {
          option.selected = true;
        }
        select.appendChild(option);
      });
    }

    function ensureStagingSelectOption() {
      var existing = select.querySelector("option[value=\"" + intakeStagingSelectValue + "\"]");
      if (!existing) {
        existing = document.createElement("option");
        existing.value = intakeStagingSelectValue;
        existing.textContent = intakeStagingPath + " (merge mode)";
        select.appendChild(existing);
      }
      select.value = intakeStagingSelectValue;
    }

    function removeStagingSelectOption() {
      var existing = select.querySelector("option[value=\"" + intakeStagingSelectValue + "\"]");
      if (existing) {
        existing.remove();
      }
    }

    var intakeDryRunButton = document.getElementById("admin-intake-dryrun");
    var intakePreviewNode = document.getElementById("admin-intake-preview");

    function updateIntakeMergeActionVisibility() {
      var visible = (activePath === intakeStagingPath);
      intakeMergeConfirmButton.style.display = visible ? "inline-flex" : "none";
      intakeMergeConfirmButton.setAttribute("aria-hidden", visible ? "false" : "true");
      if (intakeDryRunButton) {
        intakeDryRunButton.style.display = visible ? "inline-flex" : "none";
        intakeDryRunButton.setAttribute("aria-hidden", visible ? "false" : "true");
      }
      if (!visible && intakePreviewNode) {
        intakePreviewNode.style.display = "none";
        intakePreviewNode.innerHTML = "";
      }
      if (visible) {
        ensureStagingSelectOption();
      } else {
        removeStagingSelectOption();
      }
    }

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }

    function renderMergePreview(preview) {
      if (!intakePreviewNode) return;
      var totalConflicts = 0;
      var rows = (preview.students || []).map(function (st) {
        var groups = (st.groups || []).map(function (g) {
          return "<code>" + escapeHtml(g.slug) + "</code>" + (g.already_member ? " <span class=\"grade-weight\">(уже в группе)</span>" : " <span style=\"color:var(--solved-text);font-weight:700;\">+ добавится</span>");
        }).join(", ") || "<span class=\"grade-weight\">— без групп</span>";

        var conflicts = st.conflicts || [];
        totalConflicts += conflicts.length;
        // Аккаунты, которые оказались коллизионными — подсветим отдельно.
        var conflictKeys = {};
        conflicts.forEach(function (c) { conflictKeys[(c.site + ":" + c.account_id).toLowerCase()] = true; });

        var accounts = (st.accounts || []).map(function (a) {
          var label = escapeHtml(a.site) + ":" + escapeHtml(a.account_id);
          if (conflictKeys[(a.site + ":" + a.account_id).toLowerCase()]) {
            return "<code class=\"acct-conflict\" title=\"Эта учётка есть и у другого ученика\">" + label + "</code>";
          }
          return "<code>" + label + "</code>";
        }).join(" ");

        var warn = conflicts.map(function (c) {
          return "⚠ <code>" + escapeHtml(c.site) + ":" + escapeHtml(c.account_id) + "</code> уже у <strong>" + escapeHtml(c.other_name || c.other_id) + "</strong>";
        }).join("<br>") || "<span class=\"grade-weight\">—</span>";

        return "<tr" + (conflicts.length ? " class=\"merge-conflict-row\"" : "") + "><td>" + escapeHtml(st.full_name) + "</td>" +
          "<td><code>" + escapeHtml(st.final_id) + "</code> " + (st.is_new ? "<span style=\"color:var(--solved-text);font-weight:700;\">новый</span>" : "<span class=\"grade-weight\">обновление</span>") + "</td>" +
          "<td>" + groups + "</td>" +
          "<td>" + accounts + "</td>" +
          "<td>" + warn + "</td></tr>";
      }).join("");

      var head = "<p class=\"empty-hint\">Пробный запуск (ничего не записано). Новых учеников: <strong>" + preview.added + "</strong>, обновлений: <strong>" + preview.updated + "</strong>.</p>";
      if (totalConflicts > 0) {
        head += "<p class=\"merge-conflict-note\">⚠ Найдено совпадений аккаунтов с другими учениками: <strong>" + totalConflicts + "</strong>. Проверьте — возможно, где-то указана чужая или ошибочная учётка.</p>";
      }
      intakePreviewNode.innerHTML = head +
        "<div class=\"table-wrap\"><table class=\"standings-table\"><thead><tr><th>Анкета (ФИО)</th><th>Итоговый ученик</th><th>Группы</th><th>Аккаунты</th><th>Предупреждения</th></tr></thead><tbody>" +
        (rows || "<tr><td colspan=\"5\">Пусто</td></tr>") + "</tbody></table></div>";
      intakePreviewNode.style.display = "";
    }

    async function dryRunIntakeStaging() {
      if (activePath !== intakeStagingPath) {
        setStatus("Выберите intake staging через кнопку", true);
        return;
      }
      setStatus("Пробный запуск…", false);
      var payload = await fetchJSON("/api/admin/actions/intake/dry-run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: editor.getValue() })
      });
      renderMergePreview(payload.preview || {});
      setStatus("Пробный запуск готов — проверьте таблицу ниже, затем «Сохранить и сделать merge».", false);
    }

    async function refreshFileList() {
      var current = select.value;
      var payload = await fetchJSON("/api/admin/files");
      var files = Array.isArray(payload.files) ? payload.files : [];
      if (files.length === 0) {
        buildFileOptions([], "");
        editor.setValue("", -1);
        activePath = "";
        setStatus("Нет доступных файлов для редактирования", true);
        updateIntakeMergeActionVisibility();
        return;
      }
      var selected = files.indexOf(current) >= 0 ? current : (
        files.indexOf(activePath) >= 0 ? activePath : files[0]
      );
      buildFileOptions(files, selected);
      await loadFile(selected);
    }

    async function loadFile(path) {
      if (!path) {
        editor.setValue("", -1);
        activePath = "";
        updateIntakeMergeActionVisibility();
        setStatus("Выберите файл", true);
        return;
      }
      var payload = await fetchJSON("/api/admin/file?path=" + encodeURIComponent(path));
      activePath = payload.path || path;
      editor.setValue(payload.content || "", -1);
      editor.clearSelection();
      updateIntakeMergeActionVisibility();
      setStatus("Файл загружен: " + activePath, false);
    }

    async function validateCurrentFile() {
      var path = activePath || select.value;
      var content = editor.getValue();
      await fetchJSON("/api/admin/file/validate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: path, content: content })
      });
      setStatus("JSON валиден", false);
    }

    async function saveCurrentFile() {
      var path = activePath || select.value;
      var content = editor.getValue();
      var payload = await fetchJSON("/api/admin/file/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: path, content: content })
      });
      setStatus("Сохранено: " + payload.path, false);
    }

    async function prepareIntakeStaging() {
      var payload = await fetchJSON("/api/admin/actions/intake/prepare", {
        method: "POST"
      });
      activePath = payload.path || intakeStagingPath;
      editor.setValue(payload.content || "", -1);
      editor.clearSelection();
      updateIntakeMergeActionVisibility();
      setStatus("Merge-режим: редактируется " + activePath, false);
    }

    async function saveAndMergeIntakeStaging() {
      if (activePath !== intakeStagingPath) {
        setStatus("Выберите intake staging через кнопку", true);
        return;
      }
      await fetchJSON("/api/admin/actions/intake/merge", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: editor.getValue() })
      });
      window.location.href = "/standings/admin";
    }

    select.addEventListener("change", function () {
      loadFile(select.value).catch(function (err) {
        setStatus(err.message, true);
      });
    });

    validateButton.addEventListener("click", function () {
      validateCurrentFile().catch(function (err) {
        setStatus(err.message, true);
      });
    });

    saveButton.addEventListener("click", function () {
      saveCurrentFile().catch(function (err) {
        setStatus(err.message, true);
      });
    });

    // Кнопка подготовки intake переехала на страницу «Анкеты учеников»
    // (/standings/admin/intake); staging-файл в редакторе остаётся «люком».
    if (intakePrepareButton) {
      intakePrepareButton.addEventListener("click", function () {
        prepareIntakeStaging().catch(function (err) {
          setStatus(err.message, true);
        });
      });
    }

    intakeMergeConfirmButton.addEventListener("click", function () {
      saveAndMergeIntakeStaging().catch(function (err) {
        setStatus(err.message, true);
      });
    });

    if (intakeDryRunButton) {
      intakeDryRunButton.addEventListener("click", function () {
        dryRunIntakeStaging().catch(function (err) {
          setStatus(err.message, true);
        });
      });
    }

    var defaultPath = {{.DefaultPath}};
    if (defaultPath && select.options.length > 0) {
      select.value = defaultPath;
    }

    refreshFileList().catch(function (err) {
      setStatus(err.message, true);
    });
  })();
</script>

{{end}}

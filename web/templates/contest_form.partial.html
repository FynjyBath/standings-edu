{{define "contestForm"}}
<div id="contest-form" style="display:none;">
  <h3 id="contest-form-title">Контест</h3>
  <input type="hidden" id="c-original-id" value="" />
  <div class="admin-form-grid">
    <label><span>id *</span><input type="text" id="c-id" placeholder="contest_basics" /></label>
    <label><span>Название</span><input type="text" id="c-title" placeholder="Базовые задачи" /></label>
    <label><span>Краткое название (для колонки «только сумма», опц.)</span><input type="text" id="c-shortname" placeholder="Ол-1" /></label>
    <label><span>score_system</span>
      <select id="c-score"><option value="edu">edu (плюсы)</option><option value="ioi">ioi (баллы)</option></select>
    </label>
    <label><span>Тип</span>
      <select id="c-source"><option value="tasks">tasks (набор задач)</option><option value="provider">provider (внешняя таблица)</option></select>
    </label>
    <label><span>table_name (вкладки, через запятую)</span><input type="text" id="c-tablename" placeholder="Тематические" /></label>
    <label><span>Штраф за ноль (баллы; только ioi, опц.)</span><input type="number" id="c-zeropenalty" min="0" step="1" placeholder="0" title="Вычитается из суммы за каждую задачу без баллов (пустую или с нулём)." /></label>
    <label style="flex-direction:row;align-items:center;gap:0.5rem;">
      <input type="checkbox" id="c-summarytotal" style="width:auto;" />
      <span title="В сводной таблице контест займёт одну колонку с суммой (баллы или плюсы) вместо колонок по задачам. На странице группы детализация остаётся.">В сводной — только сумма (без задач)</span>
    </label>
    <label style="flex-direction:row;align-items:center;gap:0.5rem;">
      <input type="checkbox" id="c-hidden" style="width:auto;" />
      <span title="Контест не показывается на страницах для школьников (ни списком, ни в сводной). Он по-прежнему считается (в т.ч. в оценках) и виден жюри по токену.">Скрыть на страницах школьников</span>
    </label>
  </div>

  <div style="margin-top:0.7rem;"><strong>Материалы</strong>
    <div id="c-materials"></div>
    <button type="button" id="c-add-material" class="admin-btn admin-btn--secondary" style="margin-top:0.4rem;">+ материал</button>
  </div>

  <div id="c-tasks-section" style="margin-top:0.9rem;">
    <div id="c-times" class="admin-form-grid">
      <label><span>Начало (опц., <span class="c-tz">местное время</span>)</span><input type="datetime-local" id="c-start" step="60" /></label>
      <label><span>Конец (опц., <span class="c-tz">местное время</span>)</span><input type="datetime-local" id="c-end" step="60" /></label>
      <label><span>Заморозка (опц., от конца окна)</span>
        <span style="display:flex;gap:0.4rem;">
          <select id="c-freeze-sel">
            <option value="">нет</option>
            <option value="30m">последние 30 мин</option>
            <option value="1h">последний час</option>
            <option value="1h30m">последние 1,5 ч</option>
            <option value="2h">последние 2 ч</option>
            <option value="3h">последние 3 ч</option>
            <option value="all">всё соревнование</option>
            <option value="custom">другое…</option>
          </select>
          <input type="text" id="c-freeze-custom" placeholder="45m / 2h15m" style="max-width:6rem;display:none;" />
        </span>
      </label>
    </div>
    <div style="margin-top:0.5rem;"><strong>Подконтесты</strong> <span class="empty-hint">(задачи — по одной в строке; можно ссылку на контест CF целиком или на сборник informatics …view.php?id=… целиком)</span>
      <div id="c-subcontests"></div>
      <button type="button" id="c-add-sub" class="admin-btn admin-btn--secondary" style="margin-top:0.4rem;">+ подконтест</button>
    </div>
  </div>

  <div id="c-provider-section" style="margin-top:0.9rem;display:none;">
    <div class="admin-form-grid">
      <label><span>provider</span>
        <select id="c-provider"><option value="codeforces_contest">codeforces_contest</option><option value="html_table_import">html_table_import</option></select>
      </label>
    </div>
    <label style="display:block;margin-top:0.5rem;"><span>provider_config (JSON)</span>
      <textarea id="c-provider-config" class="account-list" rows="6" spellcheck="false" placeholder='{ "contest_id": 1711, "show_unofficial": true }'></textarea>
    </label>
  </div>
</div>

<script>
  window.ContestForm = (function () {
    var $ = function (id) { return document.getElementById(id); };
    var root = $("contest-form");

    function pad2(n) { return String(n).padStart(2, "0"); }
    // RFC3339 (как в JSON) -> значение datetime-local в локальном времени браузера.
    function timeFromISO(iso) {
      if (!iso) return "";
      var d = new Date(iso);
      if (isNaN(d.getTime())) return "";
      return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + "T" + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
    }
    // Значение datetime-local -> RFC3339 со сдвигом браузера (его ждёт сервер).
    function timeToISO(v) {
      if (!v) return "";
      var d = new Date(v);
      if (isNaN(d.getTime())) return "";
      var off = -d.getTimezoneOffset();
      var sign = off < 0 ? "-" : "+";
      var abs = Math.abs(off);
      var secs = v.length > 16 ? "" : ":00";
      return v + secs + sign + pad2(Math.floor(abs / 60)) + ":" + pad2(abs % 60);
    }

    function toggleSections() {
      var isProvider = $("c-source").value === "provider";
      $("c-provider-section").style.display = isProvider ? "" : "none";
      $("c-tasks-section").style.display = isProvider ? "none" : "";
    }
    $("c-source").addEventListener("change", toggleSections);

    function addMaterial(title, url) {
      var row = document.createElement("div");
      row.className = "material-row"; row.style.cssText = "display:flex;gap:0.5rem;margin-top:0.4rem;";
      row.innerHTML = '<input type="text" class="m-title" placeholder="название" style="max-width:14rem;"><input type="text" class="m-url" placeholder="URL">';
      var del = document.createElement("button"); del.type = "button"; del.className = "admin-btn admin-btn--secondary"; del.textContent = "×";
      del.addEventListener("click", function () { row.remove(); });
      row.querySelector(".m-title").value = title || ""; row.querySelector(".m-url").value = url || "";
      row.appendChild(del); $("c-materials").appendChild(row);
    }
    $("c-add-material").addEventListener("click", function () { addMaterial("", ""); });

    function addSub(title, tasks) {
      var box = document.createElement("div");
      box.className = "sub-block"; box.style.cssText = "border:1px solid var(--line);border-radius:8px;padding:0.6rem;margin-top:0.5rem;";
      var head = document.createElement("div"); head.style.cssText = "display:flex;gap:0.5rem;align-items:center;";
      var t = document.createElement("input"); t.type = "text"; t.className = "sub-title"; t.placeholder = "название подконтеста"; t.value = title || "";
      var del = document.createElement("button"); del.type = "button"; del.className = "admin-btn admin-btn--secondary"; del.textContent = "удалить"; del.addEventListener("click", function () { box.remove(); });
      head.appendChild(t); head.appendChild(del);
      var ta = document.createElement("textarea"); ta.className = "sub-tasks account-list"; ta.rows = 5; ta.spellcheck = false; ta.placeholder = "по одной ссылке в строке";
      ta.value = (tasks || []).join("\n");
      box.appendChild(head); box.appendChild(ta); $("c-subcontests").appendChild(box);
    }
    $("c-add-sub").addEventListener("click", function () { addSub("", []); });

    function reset() {
      $("c-original-id").value = ""; $("c-id").value = ""; $("c-title").value = ""; $("c-shortname").value = "";
      $("c-score").value = "edu"; $("c-source").value = "tasks"; $("c-tablename").value = ""; $("c-zeropenalty").value = ""; $("c-summarytotal").checked = false; $("c-hidden").checked = false;
      $("c-start").value = ""; $("c-end").value = ""; setFreezeControls(""); $("c-provider").value = "codeforces_contest"; $("c-provider-config").value = "";
      $("c-materials").innerHTML = ""; $("c-subcontests").innerHTML = ""; addSub("", []);
      $("contest-form-title").textContent = "Новый контест"; toggleSections();
    }

    function fill(c) {
      reset();
      $("c-original-id").value = c.id; $("c-id").value = c.id; $("c-title").value = c.title || ""; $("c-shortname").value = c.short_name || "";
      $("c-score").value = (c.score_system || "edu");
      $("c-source").value = (c.source_type === "provider") ? "provider" : "tasks";
      $("c-tablename").value = (c.table_name || []).join(", ");
      $("c-zeropenalty").value = c.zero_penalty ? String(c.zero_penalty) : "";
      $("c-summarytotal").checked = !!c.summary_total_only;
      $("c-hidden").checked = !!c.hidden;
      $("c-materials").innerHTML = ""; (c.materials || []).forEach(function (m) { addMaterial(m.title, m.url); });
      if (c.source_type === "provider") {
        $("c-provider").value = c.provider || "codeforces_contest";
        $("c-provider-config").value = c.provider_config ? JSON.stringify(c.provider_config, null, 2) : "";
      } else {
        $("c-start").value = timeFromISO(c.start_time); $("c-end").value = timeFromISO(c.end_time);
        setFreezeControls(c.freeze || "");
        $("c-subcontests").innerHTML = "";
        var subs = c.subcontests || [];
        if (!subs.length) addSub("", []);
        subs.forEach(function (s) { addSub(s.title, (s.tasks || []).map(function (t) { return t.url || t; })); });
      }
      $("contest-form-title").textContent = "Редактирование: " + (c.title || c.id);
      toggleSections();
    }

    function collect() {
      var materials = [];
      $("c-materials").querySelectorAll(".material-row").forEach(function (row) {
        var u = (row.querySelector(".m-url").value || "").trim();
        if (u) materials.push({ title: (row.querySelector(".m-title").value || "").trim(), url: u });
      });
      var body = {
        original_id: $("c-original-id").value, id: $("c-id").value, title: $("c-title").value,
        short_name: $("c-shortname").value,
        score_system: $("c-score").value, source_type: $("c-source").value,
        table_name: $("c-tablename").value, materials: materials,
        zero_penalty: parseInt($("c-zeropenalty").value, 10) || 0,
        summary_total_only: $("c-summarytotal").checked,
        hidden: $("c-hidden").checked
      };
      if ($("c-source").value === "provider") {
        body.provider = $("c-provider").value; body.provider_config = $("c-provider-config").value;
      } else {
        body.start_time = timeToISO($("c-start").value); body.end_time = timeToISO($("c-end").value);
        body.freeze = freezeControlsValue();
        var subs = [];
        $("c-subcontests").querySelectorAll(".sub-block").forEach(function (box) {
          var tasks = (box.querySelector(".sub-tasks").value || "").split("\n").map(function (x) { return x.trim(); }).filter(Boolean);
          subs.push({ title: (box.querySelector(".sub-title").value || "").trim(), tasks: tasks });
        });
        body.subcontests = subs;
      }
      return body;
    }

    function show() { root.style.display = ""; }
    function hide() { root.style.display = "none"; }

    // Селект заморозки: пресеты + «другое…» со свободным вводом длительности.
    function syncFreezeCustom() {
      $("c-freeze-custom").style.display = ($("c-freeze-sel").value === "custom") ? "" : "none";
    }
    $("c-freeze-sel").addEventListener("change", syncFreezeCustom);
    function setFreezeControls(value) {
      value = (value || "").trim();
      var hasPreset = [].slice.call($("c-freeze-sel").options).some(function (o) { return o.value === value; });
      if (value && !hasPreset) {
        $("c-freeze-sel").value = "custom";
        $("c-freeze-custom").value = value;
      } else {
        $("c-freeze-sel").value = value;
        $("c-freeze-custom").value = "";
      }
      syncFreezeCustom();
    }
    function freezeControlsValue() {
      if ($("c-freeze-sel").value === "custom") return ($("c-freeze-custom").value || "").trim();
      return $("c-freeze-sel").value;
    }

    function setTimesVisible(visible) { $("c-times").style.display = visible ? "" : "none"; }

    // Подписываем все метки часового пояса фактическим поясом браузера —
    // именно в нём интерпретируется ввод datetime-local (хранится с этим сдвигом).
    function tzLabel() {
      var off = -new Date().getTimezoneOffset();
      var sign = off < 0 ? "-" : "+";
      var abs = Math.abs(off);
      return "UTC" + sign + pad2(Math.floor(abs / 60)) + ":" + pad2(abs % 60);
    }
    document.querySelectorAll(".c-tz").forEach(function (el) { el.textContent = "ваш пояс " + tzLabel(); });

    reset();
    return {
      fill: fill, reset: reset, collect: collect, show: show, hide: hide,
      setTimesVisible: setTimesVisible,
      timeFromISO: timeFromISO, timeToISO: timeToISO
    };
  })();
</script>
{{end}}
